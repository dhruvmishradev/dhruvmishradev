<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 135" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="hudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040212"/>
      <stop offset="50%" stop-color="#090522"/>
      <stop offset="100%" stop-color="#02000c"/>
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#00ff9d"/>
    </linearGradient>
  </defs>

  <style>
    .metric-val { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 23px; font-weight: 800; }
    .metric-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; fill: #94a3b8; }
    .metric-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; }

    @keyframes liveGlow {
      0%, 100% { filter: drop-shadow(0 0 4px #00f0ff); opacity: 0.9; }
      50% { filter: drop-shadow(0 0 12px #00f0ff); opacity: 1; }
    }
    .glow-cyan { animation: liveGlow 2.5s ease-in-out infinite; fill: #00f0ff; }

    @keyframes liveGlowGreen {
      0%, 100% { filter: drop-shadow(0 0 4px #00ff9d); opacity: 0.9; }
      50% { filter: drop-shadow(0 0 12px #00ff9d); opacity: 1; }
    }
    .glow-green { animation: liveGlowGreen 2.2s ease-in-out infinite 0.4s; fill: #00ff9d; }

    @keyframes liveGlowPink {
      0%, 100% { filter: drop-shadow(0 0 4px #ff007f); opacity: 0.9; }
      50% { filter: drop-shadow(0 0 12px #ff007f); opacity: 1; }
    }
    .glow-pink { animation: liveGlowPink 2.6s ease-in-out infinite 0.8s; fill: #ff007f; }
  </style>

  <!-- Frame Background -->
  <rect x="2" y="2" width="936" height="131" rx="14" fill="url(#hudBg)" stroke="#221345" stroke-width="1.8"/>

  <!-- Top Accent Glowing Border -->
  <path d="M 16 2 L 924 2" stroke="url(#glowLine)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Metric 1: Token Throughput -->
  <g transform="translate(40, 30)">
    <text x="0" y="0" class="metric-lbl">Inference Velocity</text>
    <text x="0" y="34" class="metric-val glow-cyan">482 <tspan font-size="14" font-weight="700" fill="#00f0ff">tok/s</tspan></text>
    <text x="0" y="56" class="metric-sub" fill="#38bdf8">⚡ Groq LPU Hardware Acceleration</text>
  </g>

  <!-- Divider -->
  <line x1="260" y1="22" x2="260" y2="110" stroke="#1c113b" stroke-width="1.5"/>

  <!-- Metric 2: Latency Budget -->
  <g transform="translate(290, 30)">
    <text x="0" y="0" class="metric-lbl">Time-To-First-Token</text>
    <text x="0" y="34" class="metric-val glow-green">&lt; 420 <tspan font-size="14" font-weight="700" fill="#00ff9d">ms</tspan></text>
    <text x="0" y="56" class="metric-sub" fill="#00ff9d">● Sub-Second Streaming Response</text>
  </g>

  <!-- Divider -->
  <line x1="490" y1="22" x2="490" y2="110" stroke="#1c113b" stroke-width="1.5"/>

  <!-- Metric 3: Active Production Tools -->
  <g transform="translate(520, 30)">
    <text x="0" y="0" class="metric-lbl">Production Apps Online</text>
    <text x="0" y="34" class="metric-val glow-pink">6 <tspan font-size="14" font-weight="700" fill="#ff007f">Live Apps</tspan></text>
    <text x="0" y="56" class="metric-sub" fill="#ff70a6">🚀 Deployed &amp; Verified on Vercel</text>
  </g>

  <!-- Divider -->
  <line x1="720" y1="22" x2="720" y2="110" stroke="#1c113b" stroke-width="1.5"/>

  <!-- Metric 4: Schema Accuracy -->
  <g transform="translate(750, 30)">
    <text x="0" y="0" class="metric-lbl">Output Determinism</text>
    <text x="0" y="34" class="metric-val" fill="#ffb703">100%</text>
    <text x="0" y="56" class="metric-sub" fill="#ffb703">🔒 Strict Pydantic Typings</text>
  </g>
</svg>
