<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 130" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <style>
    .metric-val { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 22px; font-weight: 800; fill: #f8fafc; }
    .metric-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; fill: #64748b; }
    .metric-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #38bdf8; }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
    }
    .live-pulse { animation: pulseGlow 2s ease-in-out infinite; }

    @keyframes progressScan {
      0% { width: 40px; }
      50% { width: 180px; }
      100% { width: 40px; }
    }
    .animated-bar { animation: progressScan 4s ease-in-out infinite; }
  </style>

  <rect x="2" y="2" width="936" height="126" rx="12" fill="#080e1e" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Metric 1: Token Throughput -->
  <g transform="translate(40, 28)">
    <text x="0" y="0" class="metric-lbl">Inference Throughput</text>
    <text x="0" y="32" class="metric-val live-pulse">482 <tspan font-size="14" font-weight="600" fill="#38bdf8">tok/s</tspan></text>
    <text x="0" y="54" class="metric-sub">⚡ Groq LPU Hardware Acceleration</text>
  </g>

  <!-- Divider -->
  <line x1="260" y1="20" x2="260" y2="105" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Metric 2: Latency Budget -->
  <g transform="translate(290, 28)">
    <text x="0" y="0" class="metric-lbl">Time-To-First-Token</text>
    <text x="0" y="32" class="metric-val" fill="#a7f3d0">&lt; 420 <tspan font-size="14" font-weight="600" fill="#34d399">ms</tspan></text>
    <text x="0" y="54" class="metric-sub" fill="#34d399">● Sub-Second Streaming Responses</text>
  </g>

  <!-- Divider -->
  <line x1="490" y1="20" x2="490" y2="105" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Metric 3: Active Production Tools -->
  <g transform="translate(520, 28)">
    <text x="0" y="0" class="metric-lbl">Production Apps Online</text>
    <text x="0" y="32" class="metric-val">6 <tspan font-size="14" font-weight="600" fill="#c084fc">Deployments</tspan></text>
    <text x="0" y="54" class="metric-sub" fill="#c084fc">🚀 Continuous Vercel &amp; Cloud CI/CD</text>
  </g>

  <!-- Divider -->
  <line x1="720" y1="20" x2="720" y2="105" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Metric 4: Schema Accuracy -->
  <g transform="translate(750, 28)">
    <text x="0" y="0" class="metric-lbl">Output Determinism</text>
    <text x="0" y="32" class="metric-val" fill="#38bdf8">100%</text>
    <text x="0" y="54" class="metric-sub">🔒 Strict Pydantic Typings</text>
  </g>
</svg>
