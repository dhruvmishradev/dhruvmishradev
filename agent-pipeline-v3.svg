<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" width="100%" height="100%" fill="none">
  <defs>
    <!-- Deep Obsidian Canvas Gradient -->
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030014"/>
      <stop offset="40%" stop-color="#0a0520"/>
      <stop offset="70%" stop-color="#070d1e"/>
      <stop offset="100%" stop-color="#02000a"/>
    </linearGradient>

    <!-- Neon Aurora Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>

    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>

    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>

    <linearGradient id="neonAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ff0055"/>
    </linearGradient>

    <!-- Intense Holographic Glow Filters -->
    <filter id="intenseCyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feGaussianBlur stdDeviation="9" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intensePurple" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGreen" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intensePink" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .cyber-title { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11.5px; font-weight: 800; letter-spacing: 2.2px; fill: #00f0ff; }
    .status-badge { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; font-weight: 700; fill: #00ff9d; }
    .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; font-size: 13.5px; font-weight: 800; fill: #ffffff; }
    .node-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; fill: #94a3b8; }
    .node-pill { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9px; font-weight: 800; letter-spacing: 0.6px; }

    /* Flowing Laser Beams */
    .track-wire { stroke: #151a30; stroke-width: 2.5; stroke-linecap: round; }
    .track-loop { stroke: #00f0ff; stroke-width: 2; stroke-dasharray: 4 8; opacity: 0.35; }

    .beam-flow {
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 14 36;
      animation: photonFlow 2.2s linear infinite;
    }
    .flow-cyan { stroke: #00f0ff; filter: drop-shadow(0 0 6px #00f0ff); }
    .flow-purple { stroke: #d946ef; filter: drop-shadow(0 0 6px #c026d3); }
    .flow-green { stroke: #00ff9d; filter: drop-shadow(0 0 6px #00ff9d); }
    .flow-amber { stroke: #ff9900; filter: drop-shadow(0 0 6px #ff9900); }

    @keyframes photonFlow {
      from { stroke-dashoffset: 100; }
      to { stroke-dashoffset: 0; }
    }

    /* Radar Ping */
    @keyframes radarWave {
      0% { r: 4; opacity: 1; }
      100% { r: 18; opacity: 0; }
    }
    .radar-pulse { animation: radarWave 1.8s cubic-bezier(0, 0.2, 0.8, 1) infinite; }

    /* Node Aura Breathing */
    @keyframes glowAuraCyan {
      0%, 100% { stroke-opacity: 0.5; stroke-width: 1.8; filter: drop-shadow(0 0 3px #00f0ff); }
      50% { stroke-opacity: 1; stroke-width: 2.4; filter: drop-shadow(0 0 10px #00f0ff); }
    }
    @keyframes glowAuraPink {
      0%, 100% { stroke-opacity: 0.5; stroke-width: 1.8; filter: drop-shadow(0 0 4px #ff007f); }
      50% { stroke-opacity: 1; stroke-width: 2.6; filter: drop-shadow(0 0 12px #ff007f); }
    }
    @keyframes glowAuraGreen {
      0%, 100% { stroke-opacity: 0.5; stroke-width: 1.8; filter: drop-shadow(0 0 3px #00ff9d); }
      50% { stroke-opacity: 1; stroke-width: 2.4; filter: drop-shadow(0 0 10px #00ff9d); }
    }

    .pulse-cyan { animation: glowAuraCyan 2.8s ease-in-out infinite; }
    .pulse-pink { animation: glowAuraPink 2.4s ease-in-out infinite 0.4s; }
    .pulse-green { animation: glowAuraGreen 2.6s ease-in-out infinite 0.8s; }

    /* Scanning Hologram Line */
    @keyframes holoScan {
      0% { y: 2; opacity: 0; }
      30%, 70% { opacity: 0.45; }
      100% { y: 446; opacity: 0; }
    }
    .holo-beam { animation: holoScan 5.5s linear infinite; }
  </style>

  <!-- Outer Frame -->
  <rect x="2" y="2" width="936" height="446" rx="16" fill="url(#cyberBg)" stroke="#1e184a" stroke-width="2"/>

  <!-- Scanning Holographic Beam -->
  <rect x="4" y="0" width="932" height="3" fill="url(#neonCyan)" class="holo-beam" filter="url(#intenseCyan)"/>

  <!-- Futuristic Cyber Grid Overlay -->
  <g opacity="0.06" stroke="#00f0ff" stroke-width="1">
    <path d="M 0 55 L 940 55 M 0 155 L 940 155 M 0 255 L 940 255 M 0 355 L 940 355"/>
    <path d="M 180 0 L 180 450 M 360 0 L 360 450 M 540 0 L 540 450 M 720 0 L 720 450"/>
  </g>

  <!-- Header Banner Bar -->
  <rect x="2" y="2" width="936" height="46" rx="16" fill="#08031e" stroke="#2a1b54" stroke-width="1.2"/>
  <circle cx="24" cy="23" r="5" fill="#ff0055"/>
  <circle cx="40" cy="23" r="5" fill="#ffb703"/>
  <circle cx="56" cy="23" r="5" fill="#00ff9d"/>
  <text x="76" y="27" class="cyber-title">⚡ AUTONOMOUS MULTI-AGENT &amp; HYBRID RAG RUNTIME</text>

  <!-- Live Pulse Beacon -->
  <circle cx="780" cy="23" r="4" fill="#00ff9d"/>
  <circle cx="780" cy="23" class="radar-pulse" fill="none" stroke="#00ff9d" stroke-width="1.8"/>
  <text x="794" y="27" class="status-badge">PIPELINE ACTIVE · &lt;500ms TTFT</text>

  <!-- ==================== FLOW CONNECTION PATHS ==================== -->
  <!-- Client to Gateway -->
  <path d="M 155 225 L 215 225" class="track-wire"/>
  <path d="M 155 225 L 215 225" class="beam-flow flow-cyan"/>

  <!-- Gateway to Agent Router -->
  <path d="M 335 225 L 395 225" class="track-wire"/>
  <path d="M 335 225 L 395 225" class="beam-flow flow-cyan"/>

  <!-- Router to Web Tool -->
  <path d="M 495 205 C 525 205, 525 125, 560 125" class="track-wire"/>
  <path d="M 495 205 C 525 205, 525 125, 560 125" class="beam-flow flow-purple"/>

  <!-- Router to RAG Tool -->
  <path d="M 495 225 L 560 225" class="track-wire"/>
  <path d="M 495 225 L 560 225" class="beam-flow flow-green"/>

  <!-- Router to Media Tool -->
  <path d="M 495 245 C 525 245, 525 325, 560 325" class="track-wire"/>
  <path d="M 495 245 C 525 245, 525 325, 560 325" class="beam-flow flow-amber"/>

  <!-- Tools to Inference Accelerator -->
  <path d="M 705 125 C 735 125, 735 205, 770 205" class="track-wire"/>
  <path d="M 705 125 C 735 125, 735 205, 770 205" class="beam-flow flow-purple"/>

  <path d="M 705 225 L 770 225" class="track-wire"/>
  <path d="M 705 225 L 770 225" class="beam-flow flow-green"/>

  <path d="M 705 325 C 735 325, 735 245, 770 245" class="track-wire"/>
  <path d="M 705 325 C 735 325, 735 245, 770 245" class="beam-flow flow-amber"/>

  <!-- Return Loopback Streaming Token Channel -->
  <path d="M 840 260 C 840 415, 275 415, 275 265" class="track-loop"/>
  <path d="M 840 260 C 840 415, 275 415, 275 265" class="beam-flow flow-cyan" style="animation-duration: 3.2s;"/>

  <!-- ==================== ARCHITECTURE NODES ==================== -->

  <!-- NODE 1: CLIENT TIER -->
  <g transform="translate(30, 175)">
    <rect width="125" height="100" rx="12" fill="#060918" stroke="#00f0ff" class="pulse-cyan"/>
    <rect x="12" y="12" width="28" height="22" rx="5" fill="#00f0ff" opacity="0.2"/>
    <text x="26" y="27" font-size="12" text-anchor="middle" fill="#00f0ff">⚛️</text>
    <text x="12" y="52" class="node-title">Client Tier</text>
    <text x="12" y="68" class="node-sub">Next.js 16 · RSC</text>
    <text x="12" y="82" class="node-sub">React 19 Hooks</text>
    <rect x="12" y="87" width="82" height="11" rx="3" fill="#002b3d" stroke="#00f0ff" stroke-width="0.8"/>
    <text x="16" y="96" class="node-pill" fill="#00f0ff">STREAMING SSE</text>
  </g>

  <!-- NODE 2: FASTAPI GATEWAY -->
  <g transform="translate(215, 175)">
    <rect width="120" height="100" rx="12" fill="#060918" stroke="#38bdf8" stroke-width="1.8"/>
    <rect x="12" y="12" width="28" height="22" rx="5" fill="#0284c7" opacity="0.25"/>
    <text x="26" y="27" font-size="12" text-anchor="middle" fill="#38bdf8">⚡</text>
    <text x="12" y="52" class="node-title">API Gateway</text>
    <text x="12" y="68" class="node-sub">FastAPI + Uvicorn</text>
    <text x="12" y="82" class="node-sub">Async Workers</text>
    <rect x="12" y="87" width="86" height="11" rx="3" fill="#0c2340" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="16" y="96" class="node-pill" fill="#38bdf8">HTTP/2 REST</text>
  </g>

  <!-- NODE 3: AGENT ROUTER & PLANNER -->
  <g transform="translate(395, 165)">
    <rect width="100" height="120" rx="12" fill="#140628" stroke="#b026ff" class="pulse-pink"/>
    <rect x="12" y="12" width="28" height="22" rx="5" fill="#7928ca" opacity="0.3"/>
    <text x="26" y="27" font-size="12" text-anchor="middle" fill="#f0abfc">🧠</text>
    <text x="12" y="52" class="node-title">LCEL Router</text>
    <text x="12" y="68" class="node-sub">LangChain DAG</text>
    <text x="12" y="82" class="node-sub">Tool Routing</text>
    <text x="12" y="96" class="node-sub">Dynamic Plan</text>
    <rect x="12" y="102" width="76" height="11" rx="3" fill="#2d0b4e" stroke="#b026ff" stroke-width="0.8"/>
    <text x="16" y="111" class="node-pill" fill="#f0abfc">PARALLEL DAG</text>
  </g>

  <!-- ==================== PARALLEL TOOL MATRIX ==================== -->
  <!-- TOOL 1: WEB INTELLIGENCE -->
  <g transform="translate(560, 85)">
    <rect width="145" height="78" rx="10" fill="#100b2b" stroke="#c084fc" stroke-width="1.5"/>
    <text x="12" y="23" font-size="12" fill="#c084fc">🌐</text>
    <text x="30" y="23" class="node-title">Web Intelligence</text>
    <text x="12" y="44" class="node-sub">Tavily Search API</text>
    <text x="12" y="58" class="node-sub">BeautifulSoup4 Scrape</text>
    <rect x="12" y="63" width="78" height="10" rx="2" fill="#280c44"/>
    <text x="16" y="71" class="node-pill" fill="#e879f9">LIVE WEB DATA</text>
  </g>

  <!-- TOOL 2: HYBRID RAG VECTOR ENGINE -->
  <g transform="translate(560, 185)">
    <rect width="145" height="78" rx="10" fill="#041a14" stroke="#00ff9d" class="pulse-green"/>
    <text x="12" y="23" font-size="12" fill="#00ff9d">📚</text>
    <text x="30" y="23" class="node-title">Hybrid RAG Engine</text>
    <text x="12" y="44" class="node-sub">Chroma / FAISS Vectors</text>
    <text x="12" y="58" class="node-sub">Recursive Chunking</text>
    <rect x="12" y="63" width="86" height="10" rx="2" fill="#033823"/>
    <text x="16" y="71" class="node-pill" fill="#00ff9d">DENSE EMBEDDINGS</text>
  </g>

  <!-- TOOL 3: MULTIMODAL MEDIA ENGINE -->
  <g transform="translate(560, 285)">
    <rect width="145" height="78" rx="10" fill="#210b05" stroke="#ff9900" stroke-width="1.5"/>
    <text x="12" y="23" font-size="12" fill="#ff9900">🎬</text>
    <text x="30" y="23" class="node-title">Media Processor</text>
    <text x="12" y="44" class="node-sub">yt-dlp Video Stream</text>
    <text x="12" y="58" class="node-sub">FFmpeg Chunking</text>
    <rect x="12" y="63" width="80" height="10" rx="2" fill="#4d1604"/>
    <text x="16" y="71" class="node-pill" fill="#ffb703">AUDIO NORMALIZED</text>
  </g>

  <!-- NODE 4: GROQ LPU INFERENCE ACCELERATOR -->
  <g transform="translate(770, 155)">
    <rect width="145" height="140" rx="14" fill="#130210" stroke="#ff007f" class="pulse-pink"/>
    <rect width="145" height="140" rx="14" fill="#130210" stroke="url(#neonCyan)" stroke-width="1.4"/>
    <rect x="12" y="12" width="28" height="22" rx="5" fill="#ff007f" opacity="0.25"/>
    <text x="26" y="27" font-size="12" text-anchor="middle" fill="#ff007f">⚡</text>
    <text x="12" y="52" class="node-title">LPU Inference</text>
    <text x="12" y="68" class="node-sub">Groq LPU (Llama 3)</text>
    <text x="12" y="82" class="node-sub">OpenAI / Gemini Fallback</text>
    <text x="12" y="96" class="node-sub">Pydantic Validation</text>
    <rect x="12" y="108" width="121" height="22" rx="4" fill="#002b1b" stroke="#00ff9d" stroke-width="1.2"/>
    <text x="18" y="123" class="node-pill" fill="#00ff9d">480+ TOK/SEC STREAM</text>
  </g>

  <!-- Lower Return Loop Label -->
  <g transform="translate(480, 417)">
    <rect x="-90" y="-12" width="180" height="20" rx="10" fill="#030014" stroke="#00f0ff" stroke-width="1.2" filter="url(#intenseCyan)"/>
    <text x="0" y="2" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="800" fill="#00f0ff" text-anchor="middle">◀ SSE TOKEN STREAM RETURN ◀</text>
  </g>
</svg>
