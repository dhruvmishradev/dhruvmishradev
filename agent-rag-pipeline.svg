<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040714"/>
      <stop offset="50%" stop-color="#0a1026"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>

    <!-- Gradients for Cards and Beams -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowPurple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .mono-header { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; letter-spacing: 1.8px; fill: #64748b; }
    .status-badge { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #38bdf8; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #f8fafc; }
    .card-subtitle { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; fill: #94a3b8; }
    .card-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.5px; }

    /* Animated Multi-Speed Lasers */
    .wire-base { stroke: #1e293b; stroke-width: 2; stroke-linecap: round; }
    .wire-dashed { stroke: #334155; stroke-width: 2; stroke-dasharray: 4 6; }
    
    .laser-fast {
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-dasharray: 14 40;
      animation: laserTravel 2.1s linear infinite;
    }
    .laser-medium {
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-dasharray: 12 36;
      animation: laserTravel 2.6s linear infinite;
    }
    .laser-cyan { stroke: #38bdf8; filter: drop-shadow(0 0 5px #0284c7); }
    .laser-purple { stroke: #c084fc; filter: drop-shadow(0 0 5px #9333ea); }
    .laser-green { stroke: #34d399; filter: drop-shadow(0 0 5px #059669); }
    .laser-orange { stroke: #fb923c; filter: drop-shadow(0 0 5px #ea580c); }

    @keyframes laserTravel {
      from { stroke-dashoffset: 108; }
      to { stroke-dashoffset: 0; }
    }

    /* Radar Beacon Pulse */
    @keyframes radarPing {
      0% { r: 3.5; opacity: 1; }
      100% { r: 15; opacity: 0; }
    }
    .radar-pulse { animation: radarPing 1.8s cubic-bezier(0, 0.2, 0.8, 1) infinite; }

    /* Node Glowing Aura Pulses */
    @keyframes nodeBreathe {
      0%, 100% { stroke-opacity: 0.4; stroke-width: 1.5; }
      50% { stroke-opacity: 1; stroke-width: 2.2; filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.4)); }
    }
    @keyframes purpleBreathe {
      0%, 100% { stroke-opacity: 0.4; stroke-width: 1.5; }
      50% { stroke-opacity: 1; stroke-width: 2.2; filter: drop-shadow(0 0 6px rgba(168, 85, 247, 0.4)); }
    }
    @keyframes flameBreathe {
      0%, 100% { stroke-opacity: 0.4; stroke-width: 1.6; }
      50% { stroke-opacity: 1; stroke-width: 2.4; filter: drop-shadow(0 0 8px rgba(244, 63, 94, 0.5)); }
    }

    .pulse-node-cyan { animation: nodeBreathe 3s ease-in-out infinite; }
    .pulse-node-purple { animation: purpleBreathe 2.7s ease-in-out infinite 0.4s; }
    .pulse-node-flame { animation: flameBreathe 2.3s ease-in-out infinite 0.8s; }

    /* Animated Scanning Glow Line */
    @keyframes scanLineAnim {
      0% { y: 2; opacity: 0; }
      50% { opacity: 0.25; }
      100% { y: 440; opacity: 0; }
    }
    .scanner-beam {
      animation: scanLineAnim 6s linear infinite;
    }
  </style>

  <!-- Frame Background -->
  <rect x="2" y="2" width="936" height="446" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.8"/>

  <!-- Subtle Animated Scanning Line -->
  <rect x="4" y="0" width="932" height="2" fill="url(#cyanGrad)" class="scanner-beam"/>

  <!-- Minimal Decorative Tech Grid -->
  <g opacity="0.05" stroke="#94a3b8" stroke-width="1">
    <path d="M 0 50 L 940 50 M 0 150 L 940 150 M 0 250 L 940 250 M 0 350 L 940 350"/>
    <path d="M 180 0 L 180 450 M 360 0 L 360 450 M 540 0 L 540 450 M 720 0 L 720 450"/>
  </g>

  <!-- Top Terminal Bar -->
  <rect x="2" y="2" width="936" height="42" rx="14" fill="#070b16" stroke="#1e293b" stroke-width="1"/>
  <circle cx="22" cy="21" r="4.5" fill="#ef4444"/>
  <circle cx="36" cy="21" r="4.5" fill="#eab308"/>
  <circle cx="50" cy="21" r="4.5" fill="#22c55e"/>
  <text x="70" y="25" class="mono-header">AUTONOMOUS MULTI-AGENT &amp; HYBRID RAG RUNTIME</text>

  <!-- Live Pulse Beacon -->
  <circle cx="785" cy="21" r="3.5" fill="#10b981"/>
  <circle cx="785" cy="21" class="radar-pulse" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <text x="798" y="25" class="status-badge">PIPELINE ACTIVE · &lt;500ms TTFT</text>

  <!-- ==================== FLOW CONNECTION PATHS ==================== -->
  <!-- Client to Gateway -->
  <path d="M 155 225 L 215 225" class="wire-base"/>
  <path d="M 155 225 L 215 225" class="laser-fast laser-cyan"/>

  <!-- Gateway to Agent Router -->
  <path d="M 335 225 L 395 225" class="wire-base"/>
  <path d="M 335 225 L 395 225" class="laser-fast laser-cyan"/>

  <!-- Router to Web Intelligence -->
  <path d="M 495 205 C 520 205, 525 125, 560 125" class="wire-base"/>
  <path d="M 495 205 C 520 205, 525 125, 560 125" class="laser-medium laser-purple"/>

  <!-- Router to Vector RAG -->
  <path d="M 495 225 L 560 225" class="wire-base"/>
  <path d="M 495 225 L 560 225" class="laser-fast laser-green"/>

  <!-- Router to Media Engine -->
  <path d="M 495 245 C 520 245, 525 325, 560 325" class="wire-base"/>
  <path d="M 495 245 C 520 245, 525 325, 560 325" class="laser-medium laser-orange"/>

  <!-- Parallel Tools to Inference Accelerator -->
  <path d="M 705 125 C 735 125, 740 205, 770 205" class="wire-base"/>
  <path d="M 705 125 C 735 125, 740 205, 770 205" class="laser-medium laser-purple"/>

  <path d="M 705 225 L 770 225" class="wire-base"/>
  <path d="M 705 225 L 770 225" class="laser-fast laser-green"/>

  <path d="M 705 325 C 735 325, 740 245, 770 245" class="wire-base"/>
  <path d="M 705 325 C 735 325, 740 245, 770 245" class="laser-medium laser-orange"/>

  <!-- Return Loopback Streaming Token Channel -->
  <path d="M 840 260 C 840 415, 275 415, 275 265" class="wire-dashed" stroke="#0ea5e9"/>
  <path d="M 840 260 C 840 415, 275 415, 275 265" class="laser-fast laser-cyan" style="animation-duration: 3.2s;"/>

  <!-- ==================== ARCHITECTURE NODES ==================== -->

  <!-- NODE 1: CLIENT TIER -->
  <g transform="translate(30, 175)">
    <rect width="125" height="100" rx="10" fill="#080e1e" stroke="#38bdf8" class="pulse-node-cyan"/>
    <rect x="12" y="12" width="26" height="20" rx="4" fill="#0369a1" opacity="0.25"/>
    <text x="25" y="26" font-size="11" text-anchor="middle" fill="#38bdf8">⚛️</text>
    <text x="12" y="52" class="card-title">Client Tier</text>
    <text x="12" y="68" class="card-subtitle">Next.js 16 · RSC</text>
    <text x="12" y="82" class="card-subtitle">React 19 Hooks</text>
    <rect x="12" y="87" width="76" height="11" rx="3" fill="#0f172a" stroke="#0284c7" stroke-width="0.7"/>
    <text x="16" y="96" class="card-tag" fill="#38bdf8">STREAMING SSE</text>
  </g>

  <!-- NODE 2: FASTAPI GATEWAY -->
  <g transform="translate(215, 175)">
    <rect width="120" height="100" rx="10" fill="#080e1e" stroke="#0ea5e9" stroke-width="1.5"/>
    <rect x="12" y="12" width="26" height="20" rx="4" fill="#0284c7" opacity="0.2"/>
    <text x="25" y="26" font-size="11" text-anchor="middle" fill="#38bdf8">⚡</text>
    <text x="12" y="52" class="card-title">API Gateway</text>
    <text x="12" y="68" class="card-subtitle">FastAPI + Uvicorn</text>
    <text x="12" y="82" class="card-subtitle">Async Concurrency</text>
    <rect x="12" y="87" width="82" height="11" rx="3" fill="#0f172a" stroke="#0284c7" stroke-width="0.7"/>
    <text x="16" y="96" class="card-tag" fill="#0ea5e9">HTTP/2 WORKERS</text>
  </g>

  <!-- NODE 3: AGENT ROUTER & PLANNER -->
  <g transform="translate(395, 165)">
    <rect width="100" height="120" rx="10" fill="#100c24" stroke="#a855f7" class="pulse-node-purple"/>
    <rect x="12" y="12" width="26" height="20" rx="4" fill="#7c3aed" opacity="0.3"/>
    <text x="25" y="26" font-size="11" text-anchor="middle" fill="#c084fc">🧠</text>
    <text x="12" y="52" class="card-title">LCEL Router</text>
    <text x="12" y="68" class="card-subtitle">LangChain DAG</text>
    <text x="12" y="82" class="card-subtitle">Tool Dispatch</text>
    <text x="12" y="96" class="card-subtitle">Dynamic Flow</text>
    <rect x="12" y="102" width="76" height="11" rx="3" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.7"/>
    <text x="16" y="111" class="card-tag" fill="#c084fc">PARALLEL DAG</text>
  </g>

  <!-- ==================== PARALLEL TOOL MATRIX ==================== -->
  <!-- TOOL 1: WEB INTELLIGENCE -->
  <g transform="translate(560, 85)">
    <rect width="145" height="78" rx="8" fill="#0b0e20" stroke="#818cf8" stroke-width="1.3"/>
    <text x="12" y="23" font-size="11" fill="#818cf8">🌐</text>
    <text x="28" y="23" class="card-title">Web Intelligence</text>
    <text x="12" y="44" class="card-subtitle">Tavily Search API</text>
    <text x="12" y="58" class="card-subtitle">BeautifulSoup4 Scrape</text>
    <rect x="12" y="63" width="76" height="10" rx="2" fill="#1e1b4b"/>
    <text x="16" y="71" class="card-tag" fill="#a5b4fc">LIVE WEB DATA</text>
  </g>

  <!-- TOOL 2: HYBRID RAG VECTOR ENGINE -->
  <g transform="translate(560, 185)">
    <rect width="145" height="78" rx="8" fill="#041712" stroke="#10b981" stroke-width="1.5"/>
    <text x="12" y="23" font-size="11" fill="#10b981">📚</text>
    <text x="28" y="23" class="card-title">Hybrid RAG Engine</text>
    <text x="12" y="44" class="card-subtitle">Chroma / FAISS Vectors</text>
    <text x="12" y="58" class="card-subtitle">Recursive Chunking</text>
    <rect x="12" y="63" width="84" height="10" rx="2" fill="#064e3b"/>
    <text x="16" y="71" class="card-tag" fill="#6ee7b7">DENSE EMBEDDINGS</text>
  </g>

  <!-- TOOL 3: MULTIMODAL MEDIA ENGINE -->
  <g transform="translate(560, 285)">
    <rect width="145" height="78" rx="8" fill="#190c04" stroke="#f97316" stroke-width="1.3"/>
    <text x="12" y="23" font-size="11" fill="#f97316">🎬</text>
    <text x="28" y="23" class="card-title">Media Processor</text>
    <text x="12" y="44" class="card-subtitle">yt-dlp Video Stream</text>
    <text x="12" y="58" class="card-subtitle">FFmpeg Chunking</text>
    <rect x="12" y="63" width="76" height="10" rx="2" fill="#431407"/>
    <text x="16" y="71" class="card-tag" fill="#fdba74">AUDIO NORMALIZED</text>
  </g>

  <!-- NODE 4: GROQ LPU INFERENCE ACCELERATOR -->
  <g transform="translate(770, 155)">
    <rect width="145" height="140" rx="12" fill="#0f172a" stroke="#f43f5e" class="pulse-node-flame"/>
    <rect width="145" height="140" rx="12" fill="#0f172a" stroke="url(#cyanGrad)" stroke-width="1.2"/>
    <rect x="12" y="12" width="28" height="20" rx="4" fill="#f43f5e" opacity="0.2"/>
    <text x="26" y="26" font-size="11" text-anchor="middle" fill="#fb7185">⚡</text>
    <text x="12" y="52" class="card-title">LPU Inference</text>
    <text x="12" y="68" class="card-subtitle">Groq LPU (Llama 3)</text>
    <text x="12" y="82" class="card-subtitle">OpenAI / Gemini Fallback</text>
    <text x="12" y="96" class="card-subtitle">Pydantic Validation</text>
    <rect x="12" y="108" width="121" height="20" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="17" y="122" class="card-tag" fill="#a7f3d0">480+ TOK/SEC STREAM</text>
  </g>

  <!-- Lower Return Loop Label -->
  <g transform="translate(480, 417)">
    <rect x="-85" y="-11" width="170" height="18" rx="9" fill="#030712" stroke="#38bdf8" stroke-width="1"/>
    <text x="0" y="2" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" font-weight="700" fill="#38bdf8" text-anchor="middle">◀ SSE TOKEN STREAM RETURN ◀</text>
  </g>
</svg>
